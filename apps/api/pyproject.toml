[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sowcast-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1", "pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
    "PyYAML>=6,<7", "SQLAlchemy[asyncio]>=2,<3", "alembic>=1.14,<2",
    "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1",
]

[tool.setuptools.package-data]
"sowcast.agronomy" = ["crops.yaml"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
