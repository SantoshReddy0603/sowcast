services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    user: postgres
    environment:
      POSTGRES_USER: sowcast
      POSTGRES_DB: sowcast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sowcast -d sowcast]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sowcast:${POSTGRES_PASSWORD}@db:5432/sowcast
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      SOWCAST_UNAVAILABLE_SOURCE: ${SOWCAST_UNAVAILABLE_SOURCE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8000
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
volumes:
  database:
